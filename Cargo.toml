[package]
name = "riff"
version = "0.1.0"
edition = "2024"
description = "A fast, beautiful Spotify client for the terminal"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
librespot-connect = "0.8"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-playback = "0.8"
librespot-protocol = "0.8"
log = { version = "0.4", features = ["std"] }
protobuf = "3.7"
rand = "0.9"
ratatui = "0.30"
reqwest = { version = "0.12", features = ["json"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net", "io-util"] }
souvlaki = "0.8"
toml = "0.9"
unicode-width = "0.2"

[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = false
strip = true
